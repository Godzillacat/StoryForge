[project]
name = "storyforge-backend"
version = "0.1.0"
description = "StoryForge 长篇小说创作台后端"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "pydantic>=2.14",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
